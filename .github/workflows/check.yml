name: check-channels

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-channels
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить каналы
        run: python check.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Сохранить данные
        run: |
          git config user.name "channel-watch"
          git config user.email "bot@users.noreply.github.com"
          git add docs state.json
          git diff --cached --quiet || (git commit -m "Обновление данных" && git pull --rebase && git push)
